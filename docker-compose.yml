---
services:
  db:
    image: 'postgres:17.5-alpine3.21'
    init: true
    hostname: &postgres_hostname db
    restart: unless-stopped
    environment:
      POSTGRES_USER: &postgres_user postgres
      POSTGRES_PASSWORD: &postgres_password postgres
    volumes:
      - 'db_data:/var/lib/postgresql/data'
  app:
    image: 'joaodubas/livebeats:${LIVE_BEATS_TAG:-dev}'
    build:
      target: builder
      args:
        LIVE_BEATS_ENV: dev
    init: true
    pull_policy: never
    hostname: app
    restart: unless-stopped
    environment:
      LIVE_BEATS_GITHUB_CLIENT_ID: '${LIVE_BEATS_GITHUB_CLIENT_ID:-}'
      LIVE_BEATS_GITHUB_CLIENT_SECRET: '${LIVE_BEATS_GITHUB_CLIENT_SECRET:-}'
      POSTGRES_USER: *postgres_user
      POSTGRES_PASSWORD: *postgres_password
      POSTGRES_HOSTNAME: *postgres_hostname
    volumes:
      - './:/app'
      - 'app_build:/app/_build'
      - 'app_deps:/app/deps'
    ports:
      - '${LIVE_BEATS_PORT:-4000:4000}'
    entrypoint: sleep
    command: infinity
volumes:
  db_data: {}
  app_build: {}
  app_deps: {}

